[project]
name = "api-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akshat WSL", email = "akshat.thakur8@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.1",
    "strawberry-graphql[cli]>=0.327.7",
]


[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "sphinx>=9.1.0",
    "sphinx-immaterial>=0.13.9",
    "ty>=0.0.84",
]
